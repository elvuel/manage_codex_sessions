[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manage-codex-sessions"
version = "1.2.0"
description = "CLI and Qt GUI for browsing, renaming, trashing, restoring, and packaging local Codex sessions."
readme = "README.md"
requires-python = ">=3.14"
keywords = ["codex", "cli", "gui", "pyside6", "session-manager"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Desktop Environment",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Utilities",
]

[project.optional-dependencies]
gui = ["PySide6>=6.12"]
build = ["PyInstaller>=6.22", "PySide6>=6.12"]
dev = ["pytest>=8.4"]

[project.scripts]
manage-codex-sessions = "manage_codex_sessions:main"
manage-codex-sessions-gui = "manage_codex_sessions_gui:main"

[tool.setuptools]
py-modules = [
  "build_manage_codex_sessions_gui",
  "manage_codex_sessions",
  "manage_codex_sessions_gui",
  "package_release_asset",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
