name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test ${{ matrix.os-name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-name: Windows
            runs-on: windows-latest
          - os-name: Linux
            runs-on: ubuntu-latest
          - os-name: macOS
            runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: python -m pytest

      - name: Smoke test CLI entry points
        run: |
          python manage_codex_sessions.py --help
          python manage_codex_sessions.py --version
          python manage_codex_sessions_gui.py --help
          python manage_codex_sessions_gui.py --version

  typescript-cli:
    name: Test TypeScript CLI package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: manage-codex-sessions-ts/package-lock.json

      - name: Install TypeScript CLI dependencies
        working-directory: manage-codex-sessions-ts
        run: npm ci

      - name: Compile and test TypeScript CLI package
        working-directory: manage-codex-sessions-ts
        run: npm test

      - name: Smoke test TypeScript CLI executable
        working-directory: manage-codex-sessions-ts
        run: |
          node out/cli.js --help
          node out/cli.js --version

  vscode-extension:
    name: Test VS Code extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Compile and test extension
        working-directory: vscode-extension
        run: npm test
